name: tests

on:
  push:
  pull_request:

jobs:
  simulator:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    container: python:${{ matrix.python }}-bookworm
    timeout-minutes: 15
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Software rendering libraries in the CI container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libosmesa6 libgl1 libgl1-mesa-dri
      - name: Install package and test dependencies
        run: python -m pip install '.[dev]'
      - name: Simulator and CLI regression tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install and exercise the wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          marine-sim faults
          marine-sim run --seconds .2 --output /tmp/marine-wheel-smoke
